<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrafficFlow Leaflet</title>
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="panel" class="left-panel">
        <div id="health" class="line">后端状态：检测中...</div>
        <div id="data" class="line">底图状态：等待加载...</div>
        <div class="line">
          <label class="toggle">
            <input id="basemapToggle" type="checkbox" checked />
            底图显示
          </label>
        </div>
      </div>
      <div id="statsPanel" class="right-panel is-collapsed">
        <div class="panel-header">
          <div class="panel-title">Edge 统计与高亮</div>
          <button id="togglePanelBtn" type="button" class="collapse-btn">展开</button>
        </div>
        <div id="statsPanelBody" class="panel-body">
          <div class="line panel-hint">输入文件名后点击确认，例如：edge_frequency_top.json</div>
          <div class="controls">
            <input id="statsFileNameInput" type="text" value="edge_frequency_top.json" />
            <button id="applyStatsBtn" type="button">确认</button>
            <label class="toggle">
              <input id="highlightToggle" type="checkbox" checked />
              高亮显示
            </label>
          </div>
          <div id="statsMeta" class="line">统计状态：等待文件选择...</div>
          <div id="statsSummary" class="line">地图高亮：未应用</div>
          <div class="stats-list-header">
            <span>边列表</span>
            <button id="toggleListBtn" type="button" class="collapse-btn">收起</button>
          </div>
          <div id="statsList" class="stats-list"></div>
        </div>
      </div>
      <div id="startEndPanel" class="right-panel secondary-panel is-collapsed">
        <div class="panel-header">
          <div class="panel-title">起终点分布高亮</div>
          <button id="toggleStartEndPanelBtn" type="button" class="collapse-btn">展开</button>
        </div>
        <div id="startEndPanelBody" class="panel-body">
          <div class="line panel-hint">输入文件名后点击确认，例如：edge_start_end_frequency_top.json</div>
          <div class="controls">
            <input id="startEndFileNameInput" type="text" value="edge_start_end_frequency_top.json" />
            <button id="applyStartEndBtn" type="button">确认</button>
            <label class="toggle">
              <input id="startEndHighlightToggle" type="checkbox" checked />
              高亮显示
            </label>
          </div>
          <div class="controls">
            <label class="control-item-inline">
              排名类型
              <select id="startEndTypeSelect">
                <option value="start">起点</option>
                <option value="end">终点</option>
                <option value="start_or_end">起点或终点</option>
              </select>
            </label>
          </div>
          <div id="startEndMeta" class="line">统计状态：等待文件选择...</div>
          <div id="startEndSummary" class="line">地图高亮：未应用</div>
          <div class="stats-list-header">
            <span>边列表</span>
            <button id="toggleStartEndListBtn" type="button" class="collapse-btn">收起</button>
          </div>
          <div id="startEndList" class="stats-list"></div>
        </div>
      </div>
      <div id="vinPanel" class="right-panel tertiary-panel">
        <div class="panel-header">
          <div class="panel-title">VIN 轨迹查询</div>
          <button id="toggleVinPanelBtn" type="button" class="collapse-btn">收起</button>
        </div>
        <div id="vinPanelBody" class="panel-body">
          <div class="line panel-hint">支持合并/不合并轨迹查询，并展示时间戳</div>
          <div class="controls">
            <input id="vinInput" type="text" placeholder="输入 VIN，例如 1" />
            <button id="drawVinBtn" type="button">绘制轨迹</button>
            <button id="nextVinRouteBtn" type="button">下一条</button>
            <button id="clearVinBtn" type="button">清除</button>
          </div>
          <div class="line">
            <label class="toggle">
              <input id="vinMergeToggle" type="checkbox" checked />
              合并轨迹（route_by_edge.txt）
            </label>
          </div>
          <div id="vinStatus" class="line">VIN 轨迹：未绘制</div>
          <div class="stats-list-header vin-data-header">
            <span>轨迹明细（时间戳 + 边ID）</span>
          </div>
          <div id="vinRouteDataList" class="vin-route-list"></div>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="/frontend/vin-route.js"></script>
    <script src="/frontend/main.js"></script>
  </body>
</html>
